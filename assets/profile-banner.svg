<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Juliolandaetae · código y proyectos</title>
  <desc id="desc">Banner oscuro con luces violeta y cian, un motivo geométrico de terminal y el nombre del perfil.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#17133b"/>
      <stop offset="1" stop-color="#06384a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="60" r="170" fill="url(#orb)" filter="url(#blur)"/>
  <circle cx="260" cy="310" r="190" fill="#7c3aed" opacity=".23" filter="url(#blur)"/>
  <path d="M0 245 C220 180 330 300 540 225 S850 155 1200 215" fill="none" stroke="url(#glow)" stroke-opacity=".45" stroke-width="2"/>
  <path d="M0 260 C250 195 350 315 570 240 S890 175 1200 230" fill="none" stroke="#22d3ee" stroke-opacity=".18" stroke-width="1"/>
  <g transform="translate(84 83)">
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#0f172a" stroke="url(#glow)" stroke-width="2"/>
    <path d="M25 27 37 38 25 49M43 50h13" fill="none" stroke="#e2e8f0" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  </g>
  <text x="190" y="128" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="2">@JULIOLANDAETAE</text>
  <text x="194" y="174" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="5">CÓDIGO · PROYECTOS · IDEAS</text>
  <rect x="194" y="205" width="175" height="4" rx="2" fill="url(#glow)"/>
  <circle cx="1090" cy="146" r="34" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>
  <circle cx="1090" cy="146" r="15" fill="#22d3ee" fill-opacity=".8"/>
  <circle cx="1090" cy="146" r="5" fill="#ecfeff"/>
  <circle cx="980" cy="86" r="5" fill="#a78bfa"/>
  <circle cx="1150" cy="220" r="4" fill="#67e8f9"/>
  <circle cx="890" cy="205" r="3" fill="#c4b5fd"/>
</svg>

